<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Swipe-through view of part screenshots. White page, no chrome:
   tap left/right third, swipe, or use arrow keys. */
:root { color-scheme: light; --bg: #ffffff; --focus: #1d5bd6; }
html, body { margin: 0; background: var(--bg); }
.stage {
  display: flex; justify-content: center;
  padding-block: 16px 48px; padding-inline: 16px; box-sizing: border-box;
}
.shot {
  display: block; width: min(430px, 100%); height: auto;
  user-select: none; -webkit-user-drag: none;
}
.nav {
  position: fixed; top: 0; bottom: 0; width: 30%;
  border: 0; padding: 0; margin: 0; background: transparent;
}
.nav.prev { left: 0; cursor: w-resize; }
.nav.next { right: 0; cursor: e-resize; }
.nav:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }
</style>
</head>
<body>
<main class="stage"><img class="shot" id="shot" alt=""></main>
<button class="nav prev" id="prev" type="button" aria-label="이전 장"></button>
<button class="nav next" id="next" type="button" aria-label="다음 장"></button>
<script>
(() => {
  const SHOTS = {{SHOTS}};
  const img = document.getElementById('shot');
  const readHash = () => {
    const n = parseInt(location.hash.slice(1), 10);
    return Number.isFinite(n) ? Math.min(Math.max(n - 1, 0), SHOTS.length - 1) : 0;
  };
  let idx = readHash();
  const preload = (i) => { if (SHOTS[i]) { const p = new Image(); p.src = SHOTS[i].src; } };
  const show = (i) => {
    idx = Math.min(Math.max(i, 0), SHOTS.length - 1);
    img.src = SHOTS[idx].src;
    img.alt = SHOTS[idx].alt;
    try { history.replaceState(null, '', '#' + (idx + 1)); } catch { /* sandboxed frame */ }
    window.scrollTo({ top: 0 });
    preload(idx + 1); preload(idx - 1);
  };
  document.getElementById('prev').addEventListener('click', () => show(idx - 1));
  document.getElementById('next').addEventListener('click', () => show(idx + 1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'j') { e.preventDefault(); show(idx + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); show(idx - 1); }
  });
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(idx + (dx < 0 ? 1 : -1));
    x0 = y0 = null;
  });
  show(idx);
})();
</script>
</body>
</html>
